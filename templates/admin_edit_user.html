{% extends "base.html" %}

{% block title %}Edit User - {{ user.full_name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-warning">
            <h4><i class="fas fa-edit me-2"></i>Edit User: {{ user.full_name }}</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">User ID</label>
                        <input type="text" class="form-control" value="{{ user.user_id }}" disabled>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="text" name="phone_number" class="form-control" value="{{ user.phone_number }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            <option value="farmer" {% if user.role == 'farmer' %}selected{% endif %}>Farmer</option>
                            <option value="extension_officer" {% if user.role == 'extension_officer' %}selected{% endif %}>Extension Officer</option>
                            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control" value="{{ user.location or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">District</label>
                        <input type="text" name="district" class="form-control" value="{{ user.district or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Region</label>
                        <input type="text" name="region" class="form-control" value="{{ user.region or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" {% if user.is_active %}checked{% endif %}>
                            <label class="form-check-label">Active Account</label>
                        </div>
                    </div>
                    {% if user.role == 'extension_officer' %}
                    <div class="col-md-6 mb-3">
                        <div class="form-check">
                            <input type="checkbox" name="is_approved" class="form-check-input" {% if user.is_approved %}checked{% endif %}>
                            <label class="form-check-label">Approved</label>
                        </div>
                    </div>
                    {% endif %}
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
