{% extends "base.html" %} {% block title %}Add Disease - Admin{% endblock %} {%
block content %}
<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4><i class="fas fa-plus-circle text-success me-2"></i>Add New Disease</h4>
    <div>
      <a
        href="{{ url_for('main.admin_dashboard', _anchor='diseases') }}"
        class="btn btn-secondary btn-sm"
      >
        <i class="fas fa-arrow-left me-1"></i>Back
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-header bg-success text-white">
      <h6 class="mb-0">
        <i class="fas fa-plus-circle me-2"></i>Add New Disease
      </h6>
    </div>
    <div class="card-body">
      <form method="POST">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label"
              >Disease Name (English) <span class="text-danger">*</span></label
            >
            <input
              type="text"
              name="disease_name_en"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Disease Name (Swahili)</label>
            <input type="text" name="disease_name_sw" class="form-control" />
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">Scientific Name</label>
            <input type="text" name="scientific_name" class="form-control" />
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">Description (English)</label>
            <textarea
              name="description_en"
              class="form-control"
              rows="3"
            ></textarea>
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">Description (Swahili)</label>
            <textarea
              name="description_sw"
              class="form-control"
              rows="3"
            ></textarea>
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">Symptoms (English)</label>
            <textarea
              name="symptoms_en"
              class="form-control"
              rows="3"
            ></textarea>
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">Symptoms (Swahili)</label>
            <textarea
              name="symptoms_sw"
              class="form-control"
              rows="3"
            ></textarea>
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">Treatment (English)</label>
            <textarea
              name="treatment_en"
              class="form-control"
              rows="3"
            ></textarea>
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">Treatment (Swahili)</label>
            <textarea
              name="treatment_sw"
              class="form-control"
              rows="3"
            ></textarea>
          </div>
        </div>
        <div class="mt-3">
          <button type="submit" class="btn btn-success btn-sm">
            <i class="fas fa-save me-1"></i>Add Disease
          </button>
          <a
            href="{{ url_for('main.admin_dashboard', _anchor='diseases') }}"
            class="btn btn-secondary btn-sm"
          >
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
