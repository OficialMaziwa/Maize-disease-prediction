{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4><i class="fas fa-plus-circle me-2"></i>{{ title }}</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="text" name="phone_number" class="form-control" placeholder="0712345678" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password *</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    
                    {% if user_role == 'farmer' %}
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">District</label>
                        <input type="text" name="district" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Region</label>
                        <input type="text" name="region" class="form-control">
                    </div>
                    {% endif %}
                    
                    {% if user_role == 'officer' %}
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Region</label>
                        <input type="text" name="region" class="form-control">
                    </div>
                    {% endif %}
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Add {{ user_role|capitalize }}</button>
                    <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
