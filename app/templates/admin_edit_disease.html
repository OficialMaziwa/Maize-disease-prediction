{% extends "base.html" %}

{% block title %}Edit Disease{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-warning">
            <h4><i class="fas fa-edit me-2"></i>Edit Disease</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Disease Name (English) *</label>
                        <input type="text" name="disease_name_en" class="form-control" value="{{ disease.disease_name_en }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Disease Name (Swahili)</label>
                        <input type="text" name="disease_name_sw" class="form-control" value="{{ disease.disease_name_sw or '' }}">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Scientific Name</label>
                        <input type="text" name="scientific_name" class="form-control" value="{{ disease.scientific_name or '' }}">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Description (English)</label>
                        <textarea name="description_en" class="form-control" rows="3">{{ disease.description_en or '' }}</textarea>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Description (Swahili)</label>
                        <textarea name="description_sw" class="form-control" rows="3">{{ disease.description_sw or '' }}</textarea>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Symptoms (English)</label>
                        <textarea name="symptoms_en" class="form-control" rows="3">{{ disease.symptoms_en or '' }}</textarea>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Symptoms (Swahili)</label>
                        <textarea name="symptoms_sw" class="form-control" rows="3">{{ disease.symptoms_sw or '' }}</textarea>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Treatment (English)</label>
                        <textarea name="treatment_en" class="form-control" rows="3">{{ disease.treatment_en or '' }}</textarea>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Treatment (Swahili)</label>
                        <textarea name="treatment_sw" class="form-control" rows="3">{{ disease.treatment_sw or '' }}</textarea>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('main.admin_dashboard', _anchor='diseases') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
